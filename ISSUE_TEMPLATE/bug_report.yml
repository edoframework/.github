name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: input
    id: library
    attributes:
      label: Library and version
      placeholder: dev.taihei::taihei-i18n:3.0.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: ["JVM", "Scala.js", "Both"]
    validations:
      required: true
  - type: input
    id: scala
    attributes:
      label: Scala version
      placeholder: "3.9.0"
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest code that shows the problem.
      render: scala
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened
    validations:
      required: true
